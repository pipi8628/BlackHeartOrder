<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="黑心地瓜球線上預訂">
  <title>黑心地瓜球｜線上預訂</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div class="brand-mark">🍠</div>
      <p class="eyebrow">BLACK HEART</p>
      <h1>黑心地瓜球</h1>
      <p class="subtitle">現炸地瓜球・飲料線上預訂</p>
    </header>

    <section class="status-card" aria-live="polite">
      <div class="status-row"><span class="status-dot"></span><strong id="storeStatus">今日營業中</strong></div>
      <div class="wait-time"><span>目前預估等待</span><strong id="waitMinutes">約 10 分鐘</strong></div>
      <p id="storeNotice">送出訂單後，需等店家確認才算成立。</p>
    </section>

    <section id="loginPanel" class="login-card">
      <div>
        <p class="section-label">開始點餐前</p>
        <h2>請先使用 LINE 登入</h2>
        <p>登入後才能送出訂單，可降低惡意或重複下單。</p>
      </div>
      <button id="lineLoginBtn" class="primary-btn" type="button">使用 LINE 登入</button>
      <p id="loginHint" class="hint">目前為測試頁，完成 LIFF 設定後即可正式登入。</p>
    </section>

    <section id="memberPanel" class="member-card hidden">
      <div class="member-main">
        <img id="memberPicture" class="avatar" alt="LINE 頭像">
        <div><p class="section-label">歡迎回來</p><h2 id="memberName">LINE 使用者</h2></div>
      </div>
      <button id="startOrderBtn" class="primary-btn" type="button">開始點餐</button>
    </section>

    <section class="menu-preview">
      <p class="section-label">第一階段開放</p>
      <div class="menu-grid">
        <article class="menu-tile"><div class="tile-icon">🍠</div><h3>地瓜球</h3><p>口味、辣度與附加選項</p></article>
        <article class="menu-tile"><div class="tile-icon">🥤</div><h3>飲料</h3><p>尺寸、甜度、冰量與加料</p></article>
      </div>
    </section>

    <footer><p>台中西區・審計新村商圈</p><p class="fine-print">未經店家確認之訂單不成立。</p></footer>
  </main>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="./js/config.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
